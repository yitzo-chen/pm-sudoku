<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豬猴數獨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：單欄手機優先；暖粉紙色底、深墨格線，紅色代表玩家填的數字 */
:root{--bg:#FBE9E4;--card:#FFF8F5;--line:#EBC3B8;--ink:#2C2C2A;--ink2:#8A5A52;--sel:#F5B8B0;--hl:#FDE3DD;--same:#F8C9C0;--user:#C23A3A;--bad:#F7B3B3;--accent:#E0675A;--accent-d:#B94A3E;--on-accent:#FFFFFF;--kind-on:#FFE6E0;--diag:#FFF1CC;--scrim:rgba(60,30,25,.45);--cs:40px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1F1D;--card:#372A27;--line:#5C4640;--ink:#F4E6E1;--ink2:#CDAEA5;--sel:#8C4B45;--hl:#4A3733;--same:#6A403B;--user:#FF8F85;--bad:#7C3636;--accent:#D95F52;--accent-d:#B84A3F;--on-accent:#FFFFFF;--kind-on:#4C302C;--diag:#4D4326;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2A1F1D;--card:#372A27;--line:#5C4640;--ink:#F4E6E1;--ink2:#CDAEA5;--sel:#8C4B45;--hl:#4A3733;--same:#6A403B;--user:#FF8F85;--bad:#7C3636;--accent:#D95F52;--accent-d:#B84A3F;--on-accent:#FFFFFF;--kind-on:#4C302C;--diag:#4D4326;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:2px}
h2{font-size:15px;margin:20px 0 8px;font-weight:600;color:var(--ink2)}
.hero{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 4px}
.hero img{width:56px;height:auto}
.hero img:first-child{animation:bob 2.2s ease-in-out infinite}
.hero img:last-child{animation:bob 2.2s ease-in-out .5s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.sub{text-align:center;color:var(--ink2);font-size:13px;margin:2px 0 6px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.daily{display:flex;align-items:center;gap:12px;justify-content:space-between}
.daily b{font-size:16px}.daily small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kind{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.kind b{display:block;font-size:15px}.kind span{font-size:12px;color:var(--ink2)}
.kind.on{border-color:var(--accent);background:var(--kind-on);box-shadow:0 0 0 1.5px var(--accent) inset}
.levels{display:flex;gap:6px}
.lv{flex:1;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.lv.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lvdesc{font-size:12.5px;color:var(--ink2);margin:8px 2px 0;min-height:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:16px;background:var(--accent);color:var(--on-accent)}
.btn:active{background:var(--accent-d)}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%;margin-top:12px}
.best{font-size:13px;color:var(--ink2);text-align:center;margin:10px 0 0}
.foot{font-size:11.5px;color:var(--ink2);text-align:center;margin-top:22px;line-height:1.6}
/* 遊戲畫面 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:18px;line-height:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who img{width:38px;height:auto;flex:none}
.who .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.who small{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.who.r{flex-direction:row-reverse;text-align:right}
.hop{animation:hop .35s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-9px) rotate(-6deg)}100%{transform:translateY(0)}}
.title{text-align:center;font-size:13px;color:var(--ink2);margin:0 0 8px}
.bw{overflow:auto;padding:2px;-webkit-overflow-scrolling:touch}
.bd{display:grid;margin:0 auto;width:max-content;background:var(--card);border-radius:4px}
.cell{position:relative;width:var(--cs);height:var(--cs);background:var(--card);border-style:solid;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.hole{background:transparent;border-color:transparent!important;cursor:default}
.cell.diag{background:var(--diag)}
.cell.peer{background:var(--hl)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.bad{background:var(--bad)}
.v{font-size:calc(var(--cs)*.6);font-weight:600;line-height:1;position:relative;z-index:1}
.cell.user .v{color:var(--user)}
.nt{position:absolute;inset:2px;display:grid;place-items:center;font-size:calc(var(--cs)*.25);line-height:1;color:var(--ink2);font-weight:500}
.cage{position:absolute;inset:3px;border:0 dashed var(--ink2);pointer-events:none}
.sum{position:absolute;top:1px;left:3px;font-size:calc(var(--cs)*.24);line-height:1;color:var(--ink2);font-weight:700;z-index:2}
.ctl{display:flex;gap:8px;margin:12px 0 8px;align-items:center}
.ctl .b{flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.ctl .b.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pad{display:grid;gap:6px}
.pad button{position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0 6px;font-size:22px;font-weight:600;line-height:1.1}
.pad button small{position:absolute;right:4px;top:2px;font-size:10px;color:var(--ink2);font-weight:500}
.pad button:active{background:var(--sel)}
.pad button.done{opacity:.35}
.zoom{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.zoom button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:4px 14px;font-size:15px}
/* 浮層 */
.ov{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.dlg{background:var(--card);border-radius:18px;padding:20px 22px;text-align:center;max-width:360px;width:100%}
.dlg h3{margin:8px 0 4px;font-size:24px}
.dlg p{margin:4px 0;color:var(--ink2)}
.dlg .acts{display:flex;gap:8px;margin-top:14px}.dlg .acts .btn{flex:1;padding:11px 8px;font-size:15px;margin:0}
.dlg .pm{display:flex;justify-content:center;gap:16px}.dlg .pm img{width:64px;animation:hop .8s ease-in-out infinite}.dlg .pm img+img{animation-delay:.25s}
.load img{width:72px;animation:bob .9s ease-in-out infinite}
.fall{position:fixed;top:-60px;width:34px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:70;max-width:90vw;text-align:center}
@media (max-width:380px){.who .t{font-size:19px}.who img{width:32px}.lv{font-size:13px}}

</style>
</head>
<body>
<div class="wrap" id="home" hidden></div>
<div class="wrap" id="game" hidden></div>
<div class="ov" id="ov" hidden></div>
<div class="toast" id="toast" hidden></div>

    else if ((k === 'z' || k === 'Z') && (e.ctrlKey || e.metaKey)) { undo(); e.preventDefault(); }
  });

  function goHome() { save(); clearInterval(timerId); G = G && G.done ? null : G; renderHome(); }

  // ───────── 過關 ─────────
  function win() {
    G.done = true; clearInterval(timerId);
    store.del('save');
    var p = G.p, ms = Math.round(G.elapsed), best = store.get('best', {}), key = bestKey(p.kind, p.level);
    var prev = best[key], isNew = !prev || ms < prev;
    if (isNew) { best[key] = ms; store.set('best', best); }
    if (p.daily) { var dd = store.get('daily', {}); if (!dd[p.daily] || ms < dd[p.daily]) dd[p.daily] = ms; store.set('daily', dd); }
    sfx('win'); confetti();
    var ov = $('ov'); ov.hidden = false; ov.innerHTML = '';
    ov.appendChild(h('div', { 'class': 'dlg' }, [
      h('div', { 'class': 'pm' }, [img('pig'), img('monkey')]),
      h('h3', { text: isNew ? '新紀錄！' : '完成！' }),
      h('p', { text: '時間 ' + fmt(ms) + (prev && !isNew ? '（最佳 ' + fmt(prev) + '）' : '') }),
      h('div', { 'class': 'acts' }, [
        h('button', { 'class': 'btn alt', text: '回首頁', onclick: function () { hideOv(); G = null; renderHome(); } }),
        h('button', { 'class': 'btn', text: p.daily ? '再玩一題' : '再來一局', onclick: function () { hideOv(); var k = p.kind, l = p.level; G = null; startGame(p.daily ? sel.kind : k, p.daily ? sel.level : l, {}); } })
      ])
    ]));
  }

  function confetti() {
    for (var i = 0; i < 26; i++) {
      var im = img(i % 2 ? 'pig' : 'monkey', 'fall');
      im.style.left = Math.random() * 94 + 'vw';
      im.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
      im.style.animationDelay = (Math.random() * 1.2) + 's';
      document.body.appendChild(im);
      (function (n) { setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 6500); })(im);
    }
  }

  renderHome();
  window.__pmSudoku = { get G() { return G; }, startGame: startGame, E: E };
})();

</script>
